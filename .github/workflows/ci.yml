name: ci
on:
  push:
  pull_request:
jobs:
  materials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Every reference checkpoint builds and passes
        run: bin/bootcamp preflight
      - name: Skills Pack hooks
        run: python3 -m unittest discover -s skills-pack/hooks/tests -q
      - name: Mock test
        run: python3 -m unittest discover -s mock-test/tests -q
      - name: Runbooks are in sync with tools/course_data.py
        run: |
          python3 tools/gen_parts.py
          git diff --exit-code -- parts/*/README.md parts/*/PROMPTS.md
